[package]
name = "muxlane-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "muxlane"
path = "src/main.rs"

[dependencies]
muxlane-core = { path = "../muxlane-core" }
muxlane-term = { path = "../muxlane-term" }
muxlane-server = { path = "../muxlane-server" }
muxlane-client = { path = "../muxlane-client" }
muxlane-acp = { path = "../muxlane-acp" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
muxlane-store = { path = "../muxlane-store" }
notify-rust = "4"
base64.workspace = true
pulldown-cmark = "0.13"
regex.workspace = true
url = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

similar = "2.7"

[dev-dependencies]
muxlane-acp = { path = "../muxlane-acp", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
