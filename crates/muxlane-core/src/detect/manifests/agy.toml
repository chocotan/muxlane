# agy screen-state fallback rules
[[rules]]
status = "blocked"
region = "bottom"
contains = [
    "Agy requires approval",
    "Agy is waiting for input",
    "Do you want to proceed?",
    "Allow once",
    "Confirm [y/n]",
]

[[rules]]
status = "working"
region = "bottom"
contains = [
    "esc to cancel",
    "Esc to cancel",
]
regex = [
    "[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏⣾⣽⣻⢿⡿⣟⣯⣷◐◑◒◓]",
]

[[rules]]
status = "working"
region = "osc_title"
regex = ["(?i)agy.*(working|thinking|running)"]

[[rules]]
status = "idle"
region = "bottom"
contains = [
    "? for shortcuts",
]
regex = [
    "(?i)^\\s*agy\\s*[>❯]\\s*$",
    "^\\s*[>❯]\\s*$",
]
