<html lang="zh-CN">

<style>
:root{color-scheme:dark;--bg:#181a1f;--panel:#21252b;--line:#383d45;--text:#d7dae0;--muted:#a4aab5;--blue:#528bff;--green:#98c379;--yellow:#e5c07b}
*{box-sizing:border-box;border-radius:0!important}body{margin:0;background:#101214;color:var(--text);font:13px 'Noto Sans','Microsoft YaHei',sans-serif;letter-spacing:0}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:hover{background:#ffffff0c}button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}button[title]{position:relative}button[title]:hover:after{content:attr(title);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);padding:7px 10px;background:#30343a;border:1px solid #525760;color:#eef0f4;white-space:nowrap;font-size:12px;pointer-events:none;z-index:100}
.system-bar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #ffffff0a;background:#191b1e;color:#a8acb3;font-size:12px}.system-bar strong{color:#eceef1;font-size:13px}.system-left{display:flex;gap:26px;align-items:center}.desktop{height:calc(100dvh - 34px);min-height:660px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 48% 0%,#33393a 0%,#252b2c 42%,#1b2021 100%)}.desktop-label{position:absolute;top:26px;left:32px;color:#929b9c;display:flex;align-items:center;gap:12px;font-size:12px}.desktop-label b{font-size:14px;font-weight:500;color:#c1c9ca}.desktop-label span{border-left:1px solid #657071;padding-left:12px}.window{position:absolute;background:var(--bg);border:1px solid #4b5058;box-shadow:0 20px 55px #0006;display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:300px;min-height:230px;max-width:calc(100% - 24px);max-height:calc(100% - 130px)}.window.active{border-color:#778495;box-shadow:0 24px 70px #0008}.window[hidden]{display:none}.window-head{height:40px;flex:none;background:#272b31;border-bottom:1px solid var(--line);display:flex;align-items:center;padding-left:14px;gap:10px;cursor:move;touch-action:none;user-select:none}.window.active .window-head{background:#30353d}.window-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.window-name small{font-size:12px;font-weight:400;color:var(--muted);margin-left:12px}.controls{display:flex;height:100%;flex:none}.controls button{width:36px;display:grid;place-items:center}.controls button:last-child:hover{background:#a33845}.controls svg{width:14px;height:14px}.window-body{padding:22px 24px;overflow:auto;flex:1;font:13px/1.85 'DejaVu Sans Mono','Noto Sans Mono',monospace;color:#c8cdd5}.window-body p{margin:0 0 14px}.muted{color:var(--muted)}.green{color:var(--green)}.blue{color:#8eafff}.yellow{color:var(--yellow)}.agent-heading{font-size:18px;font-weight:600;color:#eceff3;margin-bottom:4px}.rule{border-top:1px solid var(--line);margin:17px 0}.prompt{padding:9px 12px;background:#252930;border-left:2px solid #788ca6;margin:16px 0}.code-line{white-space:pre-wrap;overflow-wrap:anywhere}.window-footer{height:29px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;color:var(--muted);background:#202329}.state{display:inline-flex;align-items:center;gap:7px}.state:before{content:'';width:5px;height:5px;background:currentColor}.cursor{display:inline-block;width:7px;height:15px;background:#c2c9d5;vertical-align:middle}.confirm-row{display:flex;gap:12px;margin-top:18px}.confirm-row button{border:1px solid #565b63;padding:5px 14px}.confirm-row button:first-child{border-color:var(--green);color:var(--green)}
.dock-wrap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:1000;max-width:calc(100% - 32px)}.dock{height:82px;display:flex;align-items:center;background:#202428f5;border:1px solid #52585d;box-shadow:0 14px 44px #0007;padding:9px;gap:7px}.brand{width:52px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.brand svg{width:26px;height:26px;color:#e4e8ea}.brand span{font-size:9px;color:#abb3ba}.divider{height:40px;width:1px;background:#43494e;flex:none;margin:0 4px}.project-button{height:60px;min-width:143px;text-align:left;padding:8px 10px;display:flex;align-items:center;gap:10px}.project-button strong{display:block;font-size:13px;font-weight:500}.project-button small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.project-button .chevron{width:12px;margin-left:auto}.sessions{display:flex;gap:6px;max-width:440px;overflow-x:auto;scrollbar-width:thin}.session{width:75px;height:62px;flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent}.session.active{background:#ffffff09;border-bottom-color:var(--blue)}.session .glyph{font-size:22px;line-height:25px;font-family:monospace;color:#d5dce5}.session .name{font-size:10px;color:#c2c8cf}.session .indicator{position:absolute;top:6px;right:13px;width:5px;height:5px;background:var(--green)}.session.waiting .indicator{background:var(--yellow)}.session.waiting{background:#e5c07b0a}.session.idle .indicator{background:#9a9fa8}.session.closed{opacity:.5}.tool{height:44px;width:38px;display:grid;place-items:center;flex:none}.notification-count{position:absolute;top:1px;right:1px;font-size:9px;background:var(--yellow);color:#181a1f;padding:1px 4px}.popover{position:absolute;bottom:96px;width:320px;background:#21252b;border:1px solid #515760;box-shadow:0 12px 36px #0007;padding:8px;max-height:440px;overflow:auto}.popover[hidden]{display:none}.popover h2{font-size:12px;font-weight:500;color:var(--muted);margin:10px 12px 14px}.popover button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px}.popover button strong{display:block;font-size:13px;font-weight:500}.popover button small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.popover .selected{background:#528bff13;border-left:2px solid var(--blue)}#projects{left:72px}#notices,#settings,#new-session{right:0}.settings-row{padding:12px;display:flex;justify-content:space-between;align-items:center}.settings-row select{background:#30353b;border:1px solid #545b64;padding:7px}.toast{position:absolute;bottom:125px;left:50%;transform:translateX(-50%);z-index:1100;background:#30363c;border:1px solid #56616b;padding:12px 20px;max-width:90%;font-size:12px}.toast[hidden]{display:none}.dock-wrap.compact .session{width:52px}.dock-wrap.compact .session .name{display:none}.dock-wrap.compact .project-button{min-width:112px}.dock-wrap.compact .brand{display:none}
@media(max-width:800px){.desktop-label{left:18px}.dock-wrap{bottom:12px;max-width:calc(100% - 16px);width:max-content}.dock{gap:2px;padding:5px;height:74px}.brand,.dock .divider{display:none}.project-button{min-width:96px;padding:6px}.project-button>svg{display:none}.project-button small{font-size:9px}.session{width:54px}.sessions{max-width:calc(100vw - 264px)}.tool{width:30px}.popover{width:min(320px,calc(100vw - 24px))}#projects{left:0}.window-body{padding:15px;font-size:12px}.window-name small{display:none}.system-left span{display:none}}
</style>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 5h6l2 2h10v12H3z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="maximize" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></symbol>

<symbol id="settings-icon" viewBox="0 0 24 24"><path d="M9.38 5.67L10.72 3.04H13.28L14.62 5.67L17.43 4.76L19.24 6.57L18.33 9.38L20.96 10.72V13.28L18.33 14.62L19.24 17.43L17.43 19.24L14.62 18.33L13.28 20.96H10.72L9.38 18.33L6.57 19.24L4.76 17.43L5.67 14.62L3.04 13.28V10.72L5.67 9.38L4.76 6.57L6.57 4.76Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16M9 12h12"/></symbol>

</defs></svg>
<header class="system-bar"><div class="system-left"><strong>Muxlane</strong><span>文件</span><span>窗口</span></div><span>周三 14:32</span></header>
<main class="desktop" aria-label="浮动窗口桌面原型">
 <div class="desktop-label"><b>Muxlane</b><span>浮动工作区</span></div>
 <div id="windows"></div>
 <div class="toast" role="status" hidden></div>
 <div class="dock-wrap">
  <section class="popover" id="projects" aria-label="项目切换" hidden><h2>项目与机器</h2><button class="selected" data-project="muxlane"><svg><use href="#folder"/></svg><span><strong>muxlane</strong><small>本机 · 4 个会话</small></span></button><button data-project="api-service"><svg><use href="#folder"/></svg><span><strong>api-service</strong><small>dev-server · 1 个会话</small></span></button></section>
  <section class="popover" id="notices" aria-label="通知" hidden><h2>通知 · 1 条待处理</h2><button data-focus="claude"><span class="yellow">!</span><span><strong>Claude Code 等待确认</strong><small>muxlane · 更新 3 个文件 · 刚刚</small></span></button><button data-focus="tests"><span class="green">✓</span><span><strong>测试已完成</strong><small>muxlane · 128 项通过 · 2 分钟前</small></span></button></section>
  <section class="popover" id="new-session" aria-label="新建会话" hidden><h2>新建会话</h2><button data-new="Shell"><span class="blue">&gt;_</span><span><strong>Shell</strong><small>默认终端</small></span></button><button data-new="Codex"><span>◇</span><span><strong>Codex</strong><small>编程 Agent</small></span></button><button data-new="Claude Code"><span class="yellow">✳</span><span><strong>Claude Code</strong><small>编程 Agent</small></span></button></section>
  <section class="popover" id="settings" aria-label="Dock 设置" hidden><h2>Dock 设置</h2><label class="settings-row">会话显示<select id="density"><option value="normal">图标与名称</option><option value="compact">仅图标</option></select></label><button id="restore-all"><svg><use href="#maximize"/></svg><span>显示当前项目所有窗口</span></button></section>
  <nav class="dock" aria-label="Muxlane Dock">
   <div class="brand"><svg><use href="#layout"/></svg><span>MUXLANE</span></div><div class="divider"></div>
   <button class="project-button" data-popover="projects" aria-expanded="false" title="切换项目"><svg><use href="#folder"/></svg><span><strong id="project-name">muxlane</strong><small id="machine-name">本机 / 4 个会话</small></span><svg class="chevron"><use href="#down"/></svg></button>
   <div class="divider"></div><div class="sessions" aria-label="会话"></div>
   <button class="tool" data-popover="new-session" aria-label="新建会话" aria-expanded="false" title="新建会话"><svg><use href="#plus"/></svg></button><div class="divider"></div>
   <button class="tool" data-popover="notices" aria-label="通知" aria-expanded="false" title="通知"><svg><use href="#bell"/></svg><span class="notification-count">1</span></button>
   <button class="tool" data-popover="settings" aria-label="Dock 设置" aria-expanded="false" title="Dock 设置"><svg><use href="#settings-icon"/></svg></button>
  </nav>
 </div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
let project='muxlane',active='codex',z=5,serial=0;
const sessions=[
 {id:'codex',name:'Codex',glyph:'◇',status:'运行中',state:'running',project:'muxlane',x:.045,y:78,w:.50,h:530,body:`<div class="agent-heading">OpenAI Codex</div><p class="muted">gpt-5.4 · ~/projects/muxlane</p><div class="prompt">梳理终端布局，并补充工作区切换的回归测试。</div><p>我先检查工作区状态与终端焦点的关联。</p><div class="code-line"><span class="blue">•</span> Explored<br>  Read workspace.rs, sessions.rs<br>  Search activate_agent in crates/muxlane-app</div><div class="rule"></div><p><span class="green">✓</span> 已确认项目布局恢复路径<br><span class="green">✓</span> 已补充空工作区的焦点测试<br><span class="blue">›</span> 正在检查异步创建会话后的项目归属…</p><p class="muted">  3 files inspected · 2 tests added</p><div class="rule"></div><span class="muted">› </span><span class="cursor"></span>`},
 {id:'tests',name:'Tests',glyph:'>_',status:'已完成',state:'idle',project:'muxlane',x:.625,y:83,w:.335,h:276,body:`<p><span class="green">choco@local</span> <span class="blue">~/projects/muxlane</span><br>$ cargo test --workspace</p><div class="code-line muted">running 128 tests<br>test workspace::switch_project ... <span class="green">ok</span><br>test panes::restore_layout ... <span class="green">ok</span><br>test sessions::focus_active ... <span class="green">ok</span></div><p class="green">test result: ok. 128 passed; 0 failed</p><span class="green">❯ </span><span class="cursor"></span>`},
 {id:'claude',name:'Claude',glyph:'✳',status:'等待确认',state:'waiting',project:'muxlane',x:.565,y:395,w:.38,h:310,body:`<div class="agent-heading">Claude Code <span class="muted" style="font-size:12px">v2.1</span></div><p class="muted">~/projects/muxlane</p><p>准备更新通知中心的焦点处理。</p><div class="code-line"><span class="green">+ 24</span> <span style="color:#e06c75">− 8</span>  notifications.rs<br><span class="green">+ 18</span>      notification_tests.rs</div><div class="confirm-row"><button data-approve>允许本次修改</button><button data-reject>拒绝</button></div>`},
 {id:'shell',name:'Shell',glyph:'>_',status:'空闲',state:'idle',project:'muxlane',x:.2,y:120,w:.5,h:370,hidden:true,body:'<p><span class="green">choco@local</span> <span class="blue">~/projects/muxlane</span></p>❯ <span class="cursor"></span>'},
 {id:'remote',name:'Server',glyph:'>_',status:'运行中',state:'running',project:'api-service',x:.15,y:100,w:.62,h:440,hidden:true,body:'<p><span class="green">deploy@dev-server</span> <span class="blue">~/api-service</span><br>$ pnpm dev</p><p>Server ready on port 3000<br><span class="green">GET /health 200</span><br><span class="green">GET /api/projects 200</span></p>'}
];
function drawDock(){const list=sessions.filter(s=>s.project===project);$('.sessions').innerHTML=list.map(s=>`<button class="session ${s.state} ${s.id===active?'active':''} ${$('#w-'+s.id)?.hidden?'closed':''}" data-focus="${s.id}" aria-label="${s.name} · ${s.status}" aria-pressed="${s.id===active}" title="${s.name} · ${s.status}"><span class="glyph">${s.glyph}</span><span class="name">${s.name}</span><span class="indicator"></span></button>`).join('');$('#project-name').textContent=project;$('#machine-name').textContent=(project==='muxlane'?'本机':'dev-server')+' / '+list.length+' 个会话'}
function createWindow(s){const el=document.createElement('section');el.id='w-'+s.id;el.className='window';el.setAttribute('aria-label',s.name+' 终端窗口');el.hidden=!!s.hidden;const width=$('.desktop').clientWidth;el.style.cssText=`left:${width<800?12:s.x*width}px;top:${width<800?78:s.y}px;width:${width<800?width-24:s.w*width}px;height:${s.h}px`;el.innerHTML=`<header class="window-head"><span class="${s.state==='waiting'?'yellow':'blue'}">${s.glyph}</span><div class="window-name">${s.name}<small>${s.project} · ${s.project==='muxlane'?'local':'dev-server'}</small></div><div class="controls"><button data-minimize aria-label="最小化 ${s.name}">${icon('minus')}</button><button data-maximize aria-label="最大化 ${s.name}">${icon('maximize')}</button><button data-close aria-label="关闭 ${s.name} 窗口">${icon('close')}</button></div></header><div class="window-body">${s.body}</div><footer class="window-footer"><span class="state ${s.state==='waiting'?'yellow':s.state==='running'?'green':'muted'}">${s.status}</span><span>${s.project==='muxlane'?'本机':'SSH · dev-server'}</span></footer>`;$('#windows').append(el);el.addEventListener('pointerdown',()=>focusWindow(s.id,false));const head=el.querySelector('.window-head');head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const x=e.clientX,y=e.clientY,left=el.offsetLeft,top=el.offsetTop;head.setPointerCapture(e.pointerId);head.onpointermove=ev=>{el.style.left=Math.max(0,Math.min(width-el.offsetWidth,left+ev.clientX-x))+'px';el.style.top=Math.max(0,Math.min($('.desktop').clientHeight-140,top+ev.clientY-y))+'px'};head.onpointerup=head.onpointercancel=()=>head.onpointermove=null});el.querySelector('[data-minimize]').onclick=()=>hideWindow(s.id);el.querySelector('[data-close]').onclick=()=>{hideWindow(s.id);toast(s.name+' 窗口已关闭，会话仍在后台运行')};el.querySelector('[data-maximize]').onclick=()=>{if(el.dataset.old){el.style.cssText=el.dataset.old;delete el.dataset.old}else{el.dataset.old=el.style.cssText;el.style.cssText=`left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 130px);z-index:${++z}`}}}
function focusWindow(id,changeProject=true){const s=sessions.find(s=>s.id===id);if(!s)return;if(changeProject)project=s.project;active=id;$$('.window').forEach(w=>w.classList.remove('active'));const w=$('#w-'+id);w.hidden=false;w.classList.add('active');w.style.zIndex=++z;drawDock()}
function hideWindow(id){$('#w-'+id).hidden=true;if(active===id)active=null;drawDock()}
let toastTimer;function toast(text){clearTimeout(toastTimer);$('.toast').textContent=text;$('.toast').hidden=false;toastTimer=setTimeout(()=>$('.toast').hidden=true,2800)}
function dismiss(){ $$('.popover').forEach(p=>p.hidden=true);$$('[data-popover]').forEach(b=>b.setAttribute('aria-expanded','false')) }
document.addEventListener('click',e=>{const focus=e.target.closest('[data-focus]');if(focus){focusWindow(focus.dataset.focus);dismiss()}const pop=e.target.closest('[data-popover]');if(pop){const target=$('#'+pop.dataset.popover),open=target.hidden;dismiss();target.hidden=!open;pop.setAttribute('aria-expanded',String(open))}else if(!e.target.closest('.popover'))dismiss();const p=e.target.closest('[data-project]');if(p){project=p.dataset.project;$$('[data-project]').forEach(b=>b.classList.toggle('selected',b===p));drawDock();dismiss()}const n=e.target.closest('[data-new]');if(n){const s={id:'new'+(++serial),name:n.dataset.new,glyph:n.dataset.new==='Shell'?'>_':'◇',status:'空闲',state:'idle',project,x:.18,y:110,w:.52,h:390,body:'<p class="muted">'+project+'</p><p>原型会话预览，未连接真实终端。</p>❯ <span class="cursor"></span>'};sessions.push(s);createWindow(s);focusWindow(s.id);dismiss()}if(e.target.closest('[data-approve],[data-reject]')){const approved=!!e.target.closest('[data-approve]');e.target.closest('.confirm-row').innerHTML=`<span class="${approved?'green':'muted'}">${approved?'已允许，继续执行…':'已拒绝，等待新的指令。'}</span>`;const s=sessions.find(s=>s.id==='claude');s.status=approved?'运行中':'空闲';s.state=approved?'running':'idle';$('#w-claude .state').textContent=s.status;$('.notification-count').hidden=true;$('#notices h2').textContent='通知 · 无待处理';$('#notices [data-focus="claude"] strong').textContent='Claude Code '+(approved?'已确认':'已拒绝');drawDock()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const trigger=$$('[data-popover]').find(b=>b.getAttribute('aria-expanded')==='true');dismiss();trigger?.focus()}});
$('#density').onchange=e=>$('.dock-wrap').classList.toggle('compact',e.target.value==='compact');$('#restore-all').onclick=()=>{sessions.filter(s=>s.project===project).forEach(s=>focusWindow(s.id));dismiss()};sessions.forEach(createWindow);focusWindow('codex');
// Run in the browser console: runPrototypeChecks(). Reload to reset the demo.
window.runPrototypeChecks=()=>{
 const assert=(condition,message)=>{if(!condition)throw Error(message)};
 $('#w-codex [data-close]').click();assert($('#w-codex').hidden,'Close must hide the window');
 $('[data-focus="codex"]').click();assert(!$('#w-codex').hidden&&active==='codex','Dock must reopen the existing window');
 $('[data-project="api-service"]').click();assert($('.sessions').children.length===1&&!$('#w-codex').hidden,'Project filtering must not close other windows');
 $('[data-focus="remote"]').click();assert(!$('#w-remote').hidden,'Remote session must open');
 $('[data-popover="notices"]').click();$('#notices [data-focus="claude"]').click();assert(active==='claude'&&project==='muxlane','Notification must locate its session');
 $('[data-new="Shell"]').click();assert(sessions.length===6&&active==='new1','New session must open its own window');
 const dock=$('.dock').getBoundingClientRect();assert(dock.left>=0&&dock.right<=innerWidth,'Dock must fit viewport');
 assert($$('button,.window,.popover,.dock').every(el=>getComputedStyle(el).borderRadius==='0px'),'All surfaces must be rectangular');
 return 'PASS: close/reopen, project isolation, remote window, notification routing, new session, viewport, square corners';
};
</script>
</html>
