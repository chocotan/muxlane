name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.0.1)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release Tag & Version
        id: get_version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ ! "$RAW_TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid release tag: $RAW_TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Release tag version $VERSION does not match Cargo version $CARGO_VERSION" >&2
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Release for Tag: $RAW_TAG, Version: $VERSION"

      - name: Create or Verify Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Muxlane $TAG" \
              --generate-notes
          fi

  build-linux:
    name: Build Linux (tar.gz & AppImage)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build muxlane-app (Release)
        run: cargo build -p muxlane-app --release

      - name: Build muxlane-relay (Release)
        run: cargo build -p muxlane-relay --release

      - name: Package Linux tar.gz
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          ARCH="$(uname -m)"
          NAME="muxlane-${VERSION}-linux-${ARCH}"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          install -Dm755 target/release/muxlane "$DIST/muxlane"
          install -Dm755 target/release/muxlane-relay "$DIST/muxlane-relay"
          cp README.md "$DIST/README.md"
          cp packaging/muxlane.desktop "$DIST/muxlane.desktop"
          cp packaging/muxlane.svg "$DIST/muxlane.svg"
          cp packaging/install.sh "$DIST/install.sh"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Package Linux AppImage
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          bash scripts/package-appimage.sh "$VERSION"

      - name: Upload Linux Artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.AppImage dist/*.AppImage.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: prepare-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build muxlane-app (Release)
        run: cargo build -p muxlane-app --release --target ${{ matrix.target }}

      - name: Package macOS tar.gz & zip
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          NAME="muxlane-${VERSION}-macos-${ARCH}"
          DIST="dist/$NAME"
          mkdir -p "$DIST"
          install -m 755 "target/${TARGET}/release/muxlane" "$DIST/muxlane"
          cp README.md "$DIST/README.md"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          (cd dist && zip -r "$NAME.zip" "$NAME")
          (cd dist && shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256")

      - name: Upload macOS Artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  build-android:
    name: Build Android APK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MUXLANE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MUXLANE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUXLANE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUXLANE_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/muxlane-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "MUXLANE_KEYSTORE_PATH=$KEYSTORE"
            echo "MUXLANE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MUXLANE_KEY_ALIAS=$KEY_ALIAS"
            echo "MUXLANE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon

      - name: Package APK
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p dist
          APK="muxlane-${VERSION}-android.apk"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Signed release APK was not produced. Expected: $APK_PATH" >&2
            find android/app/build/outputs/apk/release -maxdepth 1 -type f -print >&2 || true
            echo "Check the four MUXLANE_ANDROID_KEYSTORE_* repository secrets." >&2
            exit 1
          fi
          cp "$APK_PATH" "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")

      - name: Upload Android Artifact to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.apk dist/*.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  # Windows is intentionally not published yet: muxlane-server and muxlane-client
  # currently depend on Unix domain sockets and the runtime depends on tmux.
